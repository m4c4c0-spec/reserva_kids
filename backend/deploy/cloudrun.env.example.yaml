# Plantilla para desplegar el backend en Google Cloud Run.
#
#   1) Copiar a  cloudrun.env.yaml  (gitignored — ahí van los secretos reales)
#   2) Rellenar los REEMPLAZAR.  Generar el JWT:  openssl rand -base64 64
#   3) Desplegar desde la raíz del repo:
#
#        gcloud run deploy reservakids-backend \
#          --source backend/ \
#          --region us-east1 \
#          --env-vars-file backend/deploy/cloudrun.env.yaml \
#          --memory 1Gi \
#          --allow-unauthenticated
#
# Tras el 1er deploy, Cloud Run te da la URL pública. Pónla en API_URL y
# redeploya para que el webhook de Mercado Pago apunte a ella.

SPRING_PROFILES_ACTIVE: "demo"

# --- Base de datos (Neon, endpoint -pooler, SSL obligatorio) ---
DB_URL: "jdbc:postgresql://EP-HOST-pooler.REGION.aws.neon.tech/neondb?sslmode=require"
DB_USER: "neondb_owner"
DB_PASSWORD: "REEMPLAZAR"

# --- Seguridad (obligatorio, sin default) ---
JWT_SECRET: "REEMPLAZAR_64_BYTES_BASE64"

# --- URLs públicas ---
# URL de ESTA API (la entrega Cloud Run; placeholder hasta el 1er deploy).
API_URL: "https://reservakids-backend-XXXX.run.app"
# Dominio del frontend (Vercel/Netlify): CORS + base de los enlaces de email.
CORS_ALLOWED_ORIGINS: "https://TU-FRONTEND.vercel.app"
FRONTEND_URL: "https://TU-FRONTEND.vercel.app"
