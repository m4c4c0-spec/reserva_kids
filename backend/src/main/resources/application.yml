spring:
  application:
    name: reservakids-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservakids}
    username: ${DB_USER:reservakids_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo gobierna Flyway, nunca Hibernate
    open-in-view: false
  flyway:
    enabled: true
  # RF-08: email transaccional — si MAIL_HOST está vacío, el adaptador degrada a log (MVP)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Proveedores reales (Brevo/Resend/Gmail) usan auth+STARTTLS (los defaults);
      # el Mailpit de desarrollo no lleva auth (el compose pasa ambos en false).
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

server:
  # Cloud Run / Render inyectan el puerto por env (PORT). Default 8080 para dev/compose.
  port: ${PORT:8080}
  error:
    include-stacktrace: never

# Falla #8 (2 años): solo /actuator/health, sin detalles (es público para el healthcheck)
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # Un SMTP caído NO debe marcar la API entera como unhealthy (y con MAIL_HOST
      # vacío el indicador fallaba siempre). El canal de email ya tiene su propia
      # señal: fallosConsecutivos → GET /api/sistema/notificaciones → aviso del panel.
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: reservakids
    audience: reservakids-web
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  admin:
    # V18: bootstrap del primer administrador de plataforma. Si email+password están vacíos
    # no se crea ningún admin (fail-safe). Setear una vez en demo/prod; idempotente.
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    bootstrap-nombre: ${ADMIN_BOOTSTRAP_NOMBRE:Administrador}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookies:
    # Refresh token en cookie HttpOnly. Secure=true exige HTTPS (prod); en dev (HTTP)
    # debe ser false o el navegador descarta la cookie.
    secure: ${COOKIE_SECURE:true}
    # Lax mitiga CSRF cross-site en POST; Strict rompe links entrantes al área autenticada.
    same-site: ${COOKIE_SAME_SITE:Lax}
  frontend:
    # Base de los enlaces que viajan por email (reset de contraseña, falla 1.3)
    url: ${FRONTEND_URL:http://localhost:5173}
  api:
    # B1: URL pública de ESTA API — base del notificationUrl del webhook de Mercado Pago.
    # En producción DEBE ser pública (https://api.tudominio.cl); si queda en localhost,
    # MP no alcanza el webhook y los pagos online nunca se auto-confirman.
    url: ${API_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:no-reply@reservakids.cl}
  password-reset:
    # Falla 1.3 (5 años): vigencia del enlace de recuperación (un solo uso)
    minutos: ${RESET_PASSWORD_MINUTOS:30}
  reservas:
    # Criterio de aceptación RF-05: el bloque queda EN_ESPERA por 48 h
    expiracion-horas: ${RESERVA_EXPIRACION_HORAS:48}
    # Falla #1 (2 años): una COTIZADA sin respuesta libera su bloque tras N días
    cotizacion-expiracion-dias: ${COTIZACION_EXPIRACION_DIAS:14}
  citas:
    # Cita por hora sin pagar: minutos que retiene la franja antes de liberarla
    pago-expiracion-min: ${CITA_PAGO_EXPIRACION_MIN:30}
  whatsapp:
    # Notificaciones por WhatsApp. false (default) = stub: el mensaje solo se loguea.
    # Al conectar un proveedor real (Meta Cloud API / Twilio) se pone en true.
    enabled: ${WHATSAPP_ENABLED:false}
  clientes:
    # Falla #4 (2 años, Ley 21.719): retención de datos personales por inactividad
    retencion-meses: ${RETENCION_CLIENTE_MESES:24}
  tenants:
    # Falla 3.3 (5 años): ventana de gracia entre el cierre del negocio y su purga física
    # (plazo de arrepentimiento — reapertura por runbook OPERACION.md §7 — y de descarga)
    purga-dias-tras-cierre: ${TENANT_PURGA_DIAS:90}
  # El servidor corre en UTC; el negocio opera en hora chilena
  zona-horaria: ${APP_TIMEZONE:America/Santiago}
  security:
    # Activar SOLO detrás de un reverse proxy (Caddy/nginx) que setee X-Forwarded-For
    trust-proxy: ${TRUST_PROXY:false}
    # S1: clave AES-256 (base64 de 32 bytes) para cifrar credenciales de terceros (token MP,
    # secreto del webhook) en reposo. Vacía = se deriva de JWT_SECRET (ok en dev).
    # Generar una dedicada en producción: openssl rand -base64 32
    cred-key: ${CRED_ENC_KEY:}
