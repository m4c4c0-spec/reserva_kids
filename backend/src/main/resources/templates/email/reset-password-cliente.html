<th:block th:fragment="contenido">
  <p style="margin:0 0 16px">Hola <strong th:text="${nombre}">Nombre</strong>, recibimos una solicitud para <strong>restablecer tu contraseña</strong>.</p>

  <table width="100%" cellpadding="0" cellspacing="0" style="margin:24px 0">
    <tr>
      <td align="center">
        <a th:href="${link}"
           style="display:inline-block;background:linear-gradient(135deg,#b5007d,#ff6b35);color:#ffffff;text-decoration:none;padding:14px 36px;border-radius:100px;font-size:16px;font-weight:700;letter-spacing:-0.3px">
          Crear nueva contraseña
        </a>
      </td>
    </tr>
  </table>

  <p style="margin:0;font-size:13px;color:#7a6e85">
    El enlace <strong>vence en 30 minutos</strong> y sirve <strong>una sola vez</strong>.
    Si no lo pediste, ignora este correo.
  </p>
</th:block>
