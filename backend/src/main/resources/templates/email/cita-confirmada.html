<th:block th:fragment="contenido">
  <p style="margin:0 0 12px">Hola <strong th:text="${clienteNombre}">Nombre</strong>,</p>
  <p style="margin:0 0 16px">¡Tu cita en <strong th:text="${negocioNombre}">Negocio</strong> quedó confirmada!</p>

  <table width="100%" cellpadding="8" cellspacing="0" style="background:#faf8fd;border-radius:12px;margin:16px 0">
    <tr th:if="${fechaHora != null}">
      <td style="color:#7a6e85;font-size:13px;width:100px">Fecha y hora</td>
      <td style="font-weight:700" th:text="${fechaHora}">15 enero 2026, 14:00</td>
    </tr>
    <tr th:each="s : ${servicios}">
      <td style="color:#7a6e85;font-size:13px">Servicio</td>
      <td style="font-weight:700">
        <span th:text="${s.nombre}">Cumpleaños</span>
        <span th:if="${s.precio > 0}" style="color:#b5007d;font-size:13px"> — $<span th:text="${#numbers.formatInteger(s.precio, 0, 'COMMA')}">50000</span></span>
      </td>
    </tr>
    <tr th:if="${total > 0}">
      <td style="color:#7a6e85;font-size:13px">Total pagado</td>
      <td style="font-weight:700;color:#b5007d">$<span th:text="${#numbers.formatInteger(total, 0, 'COMMA')}">50000</span></td>
    </tr>
  </table>

  <p style="margin:24px 0 0;font-size:14px;color:#2d1b3d">
    <strong>¡Te esperamos!</strong> Recibirás un recordatorio 24 horas antes de tu cita.
  </p>
</th:block>
