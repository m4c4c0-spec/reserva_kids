  <table width="100%" cellpadding="0" cellspacing="0" style="margin:24px 0">
    <tr>
      <td align="center">
        <a th:href="${link}"
           style="display:inline-block;background:linear-gradient(135deg,#b5007d,#ff6b35);color:#ffffff;text-decoration:none;padding:14px 36px;border-radius:100px;font-size:16px;font-weight:700;letter-spacing:-0.3px">
          Entrar a mi panel

    </tr>

</th:block>
