# Conexión SonarCloud (org m4c4c0-spec). El scanner sube el análisis a
# https://sonarcloud.io/project/overview?id=m4c4c0-spec_reserva_kids
sonar.projectKey=m4c4c0-spec_reserva_kids
sonar.organization=m4c4c0-spec
sonar.projectName=reserva_kids

# Código de producción (lo que evalúa la quality gate) y código de test.
sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/tests

# --- Backend Java ---
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.junit.reportPaths=backend/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# --- Frontend (cobertura opcional; se activa cuando exista lcov, ver follow-up) ---
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.spec.js
